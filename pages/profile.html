<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Профиль — FantomRP</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header><div class="wrap nav"><a class="brand" href="../index.html"><span class="logo">F</span><div><b>FantomRP</b><small>ROLEPLAY PROJECT</small></div></a><nav class="links"><a href="../index.html">Главная</a><span class="navDisabled">Правила <small>СКОРО</small></span><a href="support.html">Поддержка</a><span class="navDisabled">Законка <small>СКОРО</small></span></nav><div class="auth"></div></div></header>
<main class="wrap profilePage"><section class="profileTop"><div class="profileAvatar large" id="previewAvatar">?</div><div><div class="profileName" id="previewName">Пользователь</div><div class="profileLogin" id="previewLogin">@login</div><div class="roleBadge" id="previewRole">Пользователь</div></div></section>
<section class="settingsGrid"><div class="settingsCard"><div class="cardTitle">Профиль</div><p class="muted">Настрой внешний вид профиля. Логин изменить нельзя.</p><form id="profileForm"><label>Логин</label><input class="input" disabled id="login"><label>Никнейм</label><input class="input" name="nickname" maxlength="32" placeholder="Твой никнейм"><label>Аватар</label><div class="avatarUpload"><div class="profileAvatar" id="formAvatar">?</div><div class="uploadActions"><label class="fileBtn">Загрузить аватар<input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp,image/gif"></label><button type="button" class="btn" id="removeAvatar">Убрать</button></div></div><div class="orLine">или вставь ссылку на изображение</div><input class="input" name="avatar" placeholder="https://..."><button class="btn orange">Сохранить изменения</button><div id="msg" class="success"></div></form></div>
<div class="settingsCard otherCard"><div class="cardTitle">Другое</div><a class="settingRow" href="../index.html"><span><b>Вернуться на главную</b><small>Перейти к форуму</small></span><strong>›</strong></a><a class="settingRow" href="support.html"><span><b>Поддержка</b><small>Создать обращение</small></span><strong>›</strong></a><button class="settingRow danger" onclick="logout()"><span><b>Выйти из аккаунта</b><small>Завершить текущую сессию</small></span><strong>›</strong></button></div></section><section id="adminPanel"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/auth.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const u=currentUser();if(!u)return location.href='login.html';document.getElementById('login').value=u.login;document.getElementById('previewName').textContent=u.nickname||u.login;document.getElementById('previewLogin').textContent='@'+u.login;document.getElementById('previewRole').textContent=u.role||'Пользователь';profileForm();});</script></body></html>
